name: Cleanup duplicate PDF Release Assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-duplicate-release-assets.yml"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and delete duplicate Release Assets
        env:
          GH_TOKEN: ${{ secrets.MATRIX_CLEANUP_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $REPO"
          echo "Collecting all Release Assets..."

          rm -f /tmp/releases.json /tmp/assets.json /tmp/delete.json

          gh api --paginate "/repos/$REPO/releases?per_page=100" > /tmp/releases-pages.json
          jq -s 'add' /tmp/releases-pages.json > /tmp/releases.json

          release_count=$(jq 'length' /tmp/releases.json)
          echo "Releases discovered: $release_count"

          : > /tmp/assets.json
          for release_id in $(jq -r '.[].id' /tmp/releases.json); do
            gh api --paginate "/repos/$REPO/releases/$release_id/assets?per_page=100" > "/tmp/assets-$release_id-pages.json"
            jq -s --argjson rid "$release_id" '
              add
              | map(. + {release_id: $rid})
            ' "/tmp/assets-$release_id-pages.json" > "/tmp/assets-$release_id.json"

            if [ ! -s /tmp/assets.json ]; then
              cp "/tmp/assets-$release_id.json" /tmp/assets.json
            else
              jq -s 'add' /tmp/assets.json "/tmp/assets-$release_id.json" > /tmp/assets-merged.json
              mv /tmp/assets-merged.json /tmp/assets.json
            fi
          done

          total=$(jq 'length' /tmp/assets.json)
          unique=$(jq 'map(.digest) | unique | length' /tmp/assets.json)
          duplicate_occurrences=$((total-unique))

          echo "TOTAL_ASSETS=$total"
          echo "UNIQUE_SHA256=$unique"
          echo "DUPLICATE_OCCURRENCES=$duplicate_occurrences"

          # Hard safety gate for the audited snapshot:
          # 6 Releases × 44 assets = 264 assets, 44 unique SHA-256,
          # every SHA-256 occurs exactly 6 times.
          test "$total" -eq 264
          test "$unique" -eq 44
          test "$duplicate_occurrences" -eq 220

          bad_counts=$(jq '
            group_by(.digest)
            | map({digest: .[0].digest, count: length})
            | map(select(.count != 6))
            | length
          ' /tmp/assets.json)

          test "$bad_counts" -eq 0
          echo "Safety gate passed."

          # Keep exactly one copy of each digest: the oldest Release.
          # Releases themselves are NOT deleted.
          jq '
            group_by(.digest)
            | .[]
            | sort_by(.release_created_at // "", .release_id, .id)
            | .[1:]
            | .[]
            | {id, name, digest, release_id, tag_name}
          ' /tmp/assets.json > /tmp/delete.json

          delete_count=$(jq 'length' /tmp/delete.json)
          echo "Assets scheduled for deletion: $delete_count"
          test "$delete_count" -eq 220

          deleted=0
          while IFS= read -r asset; do
            asset_id=$(jq -r '.id' <<<"$asset")
            asset_name=$(jq -r '.name' <<<"$asset")
            digest=$(jq -r '.digest' <<<"$asset")

            echo "Deleting asset_id=$asset_id name=$asset_name digest=$digest"
            gh api --method DELETE "/repos/$REPO/releases/assets/$asset_id" >/dev/null
            deleted=$((deleted+1))
          done < <(jq -c '.[]' /tmp/delete.json)

          echo "Deleted assets: $deleted"
          test "$deleted" -eq 220

          echo "Re-verifying Release Assets after deletion..."

          rm -f /tmp/assets-after.json
          : > /tmp/assets-after.json

          for release_id in $(jq -r '.[].id' /tmp/releases.json); do
            gh api --paginate "/repos/$REPO/releases/$release_id/assets?per_page=100" > "/tmp/assets-after-$release_id-pages.json"
            jq -s 'add' "/tmp/assets-after-$release_id-pages.json" > "/tmp/assets-after-$release_id.json"

            if [ ! -s /tmp/assets-after.json ]; then
              cp "/tmp/assets-after-$release_id.json" /tmp/assets-after.json
            else
              jq -s 'add' /tmp/assets-after.json "/tmp/assets-after-$release_id.json" > /tmp/assets-after-merged.json
              mv /tmp/assets-after-merged.json /tmp/assets-after.json
            fi
          done

          total_after=$(jq 'length' /tmp/assets-after.json)
          unique_after=$(jq 'map(.digest) | unique | length' /tmp/assets-after.json)
          duplicate_after=$((total_after-unique_after))

          echo "AFTER_TOTAL_ASSETS=$total_after"
          echo "AFTER_UNIQUE_SHA256=$unique_after"
          echo "AFTER_DUPLICATE_OCCURRENCES=$duplicate_after"

          test "$total_after" -eq 44
          test "$unique_after" -eq 44
          test "$duplicate_after" -eq 0

          echo "SUCCESS: 44 unique PDF Release Assets remain; no duplicate SHA-256 remains."
